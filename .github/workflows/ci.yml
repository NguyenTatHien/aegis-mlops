name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy
        run: mypy src
      - name: bandit
        run: bandit -q -r src

  test:
    name: Unit + integration tests (coverage gate 80%)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies (CPU torch, no CUDA)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-dev.txt
          pip install -e .
      - name: Run unit + integration tests with coverage
        run: pytest -m "unit or integration" --cov=src/aegis --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  data-tests:
    name: Data quality tests (real AG News)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache HF datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-datasets-ag-news-v1
      - name: Install dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run data quality tests
        run: pytest -m data

  docker-build:
    name: Build & scan Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: aegis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegis-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Only fail on CVEs with a released fix we can actually act on —
          # not on OS-package CVEs disclosed before the distro shipped a
          # patch. .trivyignore documents specific accepted-risk exceptions
          # (fixes that require an untested major version bump) on top of this.
          ignore-unfixed: true

  compose-smoke:
    name: Full-stack smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Copy .env
        run: cp .env.example .env && sed -i 's/^MODEL_SOURCE=.*/MODEL_SOURCE=mock/' .env
      - name: Bring up stack
        run: docker compose up -d --build
      - name: Wait for healthy services
        run: |
          for i in $(seq 1 40); do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              healthy_count=$(docker compose ps --format json | grep -o '"Health":"healthy"' | wc -l)
              [ "$healthy_count" -ge 4 ] && exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy in time" >&2
          exit 1
      - name: Exercise API
        run: |
          curl -sf http://127.0.0.1:8000/ -o /dev/null
          curl -sf http://127.0.0.1:8000/health -o /dev/null
          curl -sf http://127.0.0.1:8000/ready -o /dev/null
          curl -sf -X POST http://127.0.0.1:8000/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"text":"The team won the championship last night."}'
          curl -sf http://127.0.0.1:8000/metrics -o /dev/null
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Publish image to GHCR (continuous delivery)
    runs-on: ubuntu-latest
    needs: compose-smoke
    # Continuous delivery: only publish when a change lands on main.
    # On PRs the pipeline stops at the smoke test (CI gates); the image is
    # never pushed, so a PR cannot accidentally ship.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the ref, so an uppercase owner
          # (e.g. NguyenTatHien) is handled correctly for GHCR.
          images: ghcr.io/${{ github.repository }}/aegis-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
