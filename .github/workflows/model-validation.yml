name: Model Validation

# Deliberately separate from ci.yml (design.md D11): this job needs the real
# RoBERTa checkpoint (498MB) and CPU inference over the OOD proxy datasets,
# too heavy/slow for every PR on a free GitHub runner. Runs nightly and on
# demand instead.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  model-validation:
    name: Full model + OOD validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache HF datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-datasets-model-validation-v1
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-dev.txt
          pip install -e .
      - name: Fetch model artifacts
        run: echo "TODO — pull content/aegis_artifacts from the team's artifact store / MLflow registry once hosted"
      - name: Run model validation tests
        run: pytest -m model -v
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-results
          path: |
            content/aegis_artifacts/ood_operating_points.json
            content/aegis_artifacts/ood_roc_curve.png
